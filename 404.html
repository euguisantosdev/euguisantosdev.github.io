<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Página não encontrada — Guilherme dos Santos Bueno</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: radial-gradient(60% 50% at 70% 0%, rgba(37,99,235,.28), transparent 70%), #05070d;
      color: #e9eef9; font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.6; text-align: center; }
    code { font-family: ui-monospace, Menlo, Consolas, monospace; color: #5b9bff; font-size: .95rem; }
    h1 { margin: 12px 0 8px; font-size: clamp(1.8rem, 5vw, 2.6rem); letter-spacing: -.03em; color: #fff; }
    p { margin: 0 0 28px; color: #9ca7bd; }
    a { display: inline-block; padding: 13px 24px; border-radius: 12px; background: #2563eb; color: #fff; font-weight: 600; text-decoration: none; }
    a:hover { background: #2e68ee; }
    a:focus-visible { outline: 2px solid #5b9bff; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <code>erro 404</code>
    <h1>Esse endereço não existe.</h1>
    <p>A página que você procurava não está aqui — mas o portfólio está.</p>
    <a href="/">Voltar ao início</a>
  </main>
</body>
</html>
